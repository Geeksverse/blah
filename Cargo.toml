[package]
name = "zito"
version = "0.1.0"
edition = "2021"
description = "Zito - unified software management across package managers (TUI)"
license = "MIT"

[dependencies]
ratatui = "0.29"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
